repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        # Preserve Skillable export syntax and platform-managed asset references.
        exclude: ^(\.github/PULL_REQUEST_TEMPLATE\.md|agentic/aks-samples/vss-on-aks/skillable/readme-vss(2\.4|3\.3)\.md)$

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.11.2
    hooks:
      - id: markdown-link-check
        exclude: ^agentic/aks-samples/vss-on-aks/skillable/readme-vss(2\.4|3\.3)\.md$
        args: [-q, --config, .github/markdown-link-check-config.json]
