# Nginx-class Ingress for VSS LVS on AKS.
# Edit the placeholders below (or substitute with `sed`) before applying.
#
# This deviates from the vss repo's vss-ingress-example.yaml in two ways:
#   - ingressClassName: nginx (vs. haproxy) — AKS pattern uses ingress-nginx + LoadBalancer Service.
#   - Annotations are nginx-flavored (proxy-body-size, timeouts) — needed for large video uploads
#     and long-lived streaming/WebSocket connections.
#
# Paths only cover services that the LVS profile actually deploys.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: <RELEASE_NAME>-vss-ingress
  namespace: <NAMESPACE>
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2g
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: vss.<EXTERNAL_HOST>.nip.io
    http:
      paths:
      - backend:
          service:
            name: <RELEASE_NAME>-vss-ui
            port:
              number: 3000
        path: /api/chat
        pathType: Prefix
      - backend:
          service:
            name: <RELEASE_NAME>-vss-agent
            port:
              number: 8000
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: <RELEASE_NAME>-vss-agent
            port:
              number: 8000
        path: /chat
        pathType: Prefix
      - backend:
          service:
            name: <RELEASE_NAME>-vss-agent
            port:
              number: 8000
        path: /websocket
        pathType: Prefix
      - backend:
          service:
            name: <RELEASE_NAME>-vss-agent
            port:
              number: 8000
        path: /static
        pathType: Prefix
      - backend:
          service:
            name: <RELEASE_NAME>-vst-ingress-dev
            port:
              number: 30888
        path: /vst
        pathType: Prefix
      - backend:
          service:
            name: <RELEASE_NAME>-vss-ui
            port:
              number: 3000
        path: /
        pathType: Prefix
  - host: kibana.vss.<EXTERNAL_HOST>.nip.io
    http:
      paths:
      - backend:
          service:
            name: <RELEASE_NAME>-kibana
            port:
              number: 5601
        path: /
        pathType: Prefix
