# Microsoft Foundry hosted-agent definition for the Insurance Claims demo.
#
# Deploy with the azure-foundry CLI / SDK; see foundry_deploy.md.
#
# This agent uses ONE MCP server (the VSS wrapper) plus THREE Python function
# tools (policy / pricing / claim PDF). The mock function tools live in
# tools.py and Foundry hosts them as part of the agent's container.

name: insurance-claims-triage
display_name: Insurance Claims Triage Coordinator
description: |
  Turns a customer-submitted damage video into a draft claim by orchestrating
  the NVIDIA VSS Agent (video understanding) plus mock policy / pricing /
  document-drafting tools.

model:
  # Foundry project (new-style):
  #   <your-foundry-project> (<your-resource-group>, <your-region>)
  # Parent AIServices account: straive-newrp-project-resource
  # Available deployments in this project: gpt-5.4, gpt-4.1, text-embedding-ada-002
  # gpt-5.4 is the strongest tool-use model and has 1000 GS capacity.
  deployment_name: gpt-5.4
  temperature: 0.2
  top_p: 0.9
  max_output_tokens: 2000

instructions_file: agent_instructions.md

tools:
  - type: mcp
    name: vss
    description: NVIDIA VSS Agent for video understanding (upload + analyze).
    command: python
    args:
      - /app/vss_mcp_server.py
    env:
      VSS_BASE_URL: ${VSS_BASE_URL}
    # Foundry will start this MCP server in the agent's container at startup
    # and route the `vss_upload_video` / `vss_analyze_video` tools through it.

  - type: function
    name: lookup_policy
    module: tools
    description: Look up a customer's policy by VIN or policy number.

  - type: function
    name: estimate_repair_cost
    module: tools
    description: Estimate repair cost from a list of damaged-panel descriptors.

  - type: function
    name: draft_claim_pdf
    module: tools
    description: Write a draft claim PDF (or .txt fallback) to disk.

# Optional: keep generated PDFs around for adjusters to download.
artifacts:
  - path: output/
    description: Drafted claim PDFs

# Eval datasets — see foundry_deploy.md for how to curate from traces.
eval_datasets: []
