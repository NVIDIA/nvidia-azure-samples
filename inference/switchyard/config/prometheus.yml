global:
  scrape_interval: 15s
  external_labels:
    source: dgx-spark
    instance: dgx-spark
    service: switchyard

scrape_configs:
  - job_name: switchyard
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:4000"]

# Optional remote_write for Azure Monitor or another Prometheus backend.
