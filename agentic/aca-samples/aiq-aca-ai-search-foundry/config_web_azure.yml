# AI-Q 2.2.1 on Azure. The model split follows the upstream 2.2.1 web config:
# Lightning handles fast routing and shallow research; Ultra handles the
# clarifier and deep-research roles. Azure AI Search uses AI-Q's native
# knowledge-layer backend. Knowledge Base is the only research source.

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: WARNING

  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
      allow_methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      allow_credentials: true
      expose_headers:
        - "*"

llms:
  nemotron_lightning_intent_llm:
    _type: nim
    model_name: ${FOUNDRY_LIGHTNING_MODEL:-nemotron-3-5-lightning}
    base_url: ${FOUNDRY_ENDPOINT}
    api_key: ${FOUNDRY_LIGHTNING_KEY}
    temperature: 0.1
    top_p: 0.9
    max_tokens: 1024
    parallel_tool_calls: false
    reasoning_effort: none

  nemotron_lightning_agent_llm:
    _type: nim
    model_name: ${FOUNDRY_LIGHTNING_MODEL:-nemotron-3-5-lightning}
    base_url: ${FOUNDRY_ENDPOINT}
    api_key: ${FOUNDRY_LIGHTNING_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 8192
    parallel_tool_calls: false
    reasoning_effort: medium

  nemotron_ultra_llm:
    _type: nim
    model_name: ${FOUNDRY_ULTRA_MODEL:-nemotron-3-ultra}
    base_url: ${FOUNDRY_ENDPOINT}
    api_key: ${FOUNDRY_ULTRA_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 16384

  nemotron_lightning_writer_llm:
    _type: nim
    model_name: ${FOUNDRY_LIGHTNING_MODEL:-nemotron-3-5-lightning}
    base_url: ${FOUNDRY_ENDPOINT}
    api_key: ${FOUNDRY_LIGHTNING_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 32768
    parallel_tool_calls: false
    reasoning_effort: none

  summary_llm:
    _type: nim
    model_name: ${FOUNDRY_LIGHTNING_MODEL:-nemotron-3-5-lightning}
    base_url: ${FOUNDRY_ENDPOINT}
    api_key: ${FOUNDRY_LIGHTNING_KEY}
    temperature: 0.1
    max_tokens: 256
    reasoning_effort: none

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: knowledge_layer
        name: "Knowledge Base"
        description: "Search uploaded documents and files in Azure AI Search."
        tools:
          - knowledge_search

  knowledge_search:
    _type: knowledge_retrieval
    backend: azure_ai_search
    collection_name: ${COLLECTION_NAME:-aiq_default}
    generate_summary: true
    summary_model: summary_llm
    summary_db: ${AIQ_SUMMARY_DB:-sqlite+aiosqlite:///./summaries.db}
    top_k: 5

  deep_research_skills:
    _type: deep_research_skills
    agents:
      writer-agent:
        - synthesis

  intent_classifier:
    _type: intent_classifier
    llm: nemotron_lightning_intent_llm
    verbose: true

  clarifier_agent:
    _type: clarifier_agent
    llm: nemotron_ultra_llm
    planner_llm: nemotron_ultra_llm
    max_turns: 3
    enable_plan_approval: true
    log_response_max_chars: 2000
    verbose: true

  shallow_research_agent:
    _type: shallow_research_agent
    llm: nemotron_lightning_agent_llm
    verbose: true
    max_llm_turns: 10
    max_tool_iterations: 5

  deep_research_agent:
    _type: deep_research_agent
    enable_citation_verification: true
    orchestrator_llm: nemotron_ultra_llm
    source_router_llm: nemotron_ultra_llm
    researcher_llm: nemotron_ultra_llm
    planner_llm: nemotron_ultra_llm
    writer_llm: nemotron_lightning_writer_llm
    skills: deep_research_skills
    verbose: true

workflow:
  _type: chat_deepresearcher_agent
  verbose: true
  enable_escalation: true
  enable_clarifier: true
  use_async_deep_research: true
  checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}
