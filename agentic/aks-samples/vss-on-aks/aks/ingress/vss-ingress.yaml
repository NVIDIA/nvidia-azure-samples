# Browser routes validated with the VSS v3.3.0rc0 LVS profile.
# Substitute <RELEASE_NAME>, <NAMESPACE>, and <EXTERNAL_HOST> before applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: <RELEASE_NAME>-vss-ingress
  namespace: <NAMESPACE>
  annotations:
    haproxy.org/timeout-client: 3600s
    haproxy.org/timeout-server: 3600s
    haproxy.org/path-rewrite: |
      ^/storage/(.*) /vst/storage/\1
      ^/storage /vst/storage
spec:
  ingressClassName: haproxy
  rules:
  - host: vss.<EXTERNAL_HOST>.nip.io
    http:
      paths:
      - path: /api/chat
        pathType: Prefix
        backend:
          service:
            name: vss-agent-ui
            port:
              number: 3000
      - path: /api/agent
        pathType: Prefix
        backend:
          service:
            name: vss-agent-ui
            port:
              number: 3000
      - path: /api/vss-chat
        pathType: Prefix
        backend:
          service:
            name: vss-agent-ui
            port:
              number: 3000
      - path: /api/proxy
        pathType: Prefix
        backend:
          service:
            name: vss-agent-ui
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: vss-agent
            port:
              number: 8000
      - path: /chat
        pathType: Prefix
        backend:
          service:
            name: vss-agent
            port:
              number: 8000
      - path: /websocket
        pathType: Prefix
        backend:
          service:
            name: vss-agent
            port:
              number: 8000
      - path: /static
        pathType: Prefix
        backend:
          service:
            name: vss-agent
            port:
              number: 8000
      - path: /vst
        pathType: Prefix
        backend:
          service:
            name: vss-vios-ingress
            port:
              number: 30888
      - path: /storage
        pathType: Prefix
        backend:
          service:
            name: vss-vios-ingress
            port:
              number: 30888
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vss-agent-ui
            port:
              number: 3000
  - host: kibana.vss.<EXTERNAL_HOST>.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kibana
            port:
              number: 5601
