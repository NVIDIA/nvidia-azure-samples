apiVersion: v1
kind: ServiceAccount
metadata:
  name: aks-ops-mcp
  namespace: nooa-admission-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aks-ops-mcp
  namespace: nooa-admission-test
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "configmaps", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["service-api"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aks-ops-mcp
  namespace: nooa-admission-test
subjects:
  - kind: ServiceAccount
    name: aks-ops-mcp
    namespace: nooa-admission-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aks-ops-mcp
