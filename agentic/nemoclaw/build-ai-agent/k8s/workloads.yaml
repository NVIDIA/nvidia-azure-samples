apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-api
  namespace: nooa-admission-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dependency-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dependency-api
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dependency
          image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/lab_services.py"]
          env:
            - name: MODE
              value: dependency
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: code
          configMap:
            name: lab-services-code
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dependency-api
  namespace: nooa-admission-test
spec:
  selector:
    app.kubernetes.io/name: dependency-api
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-api
  namespace: nooa-admission-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-api
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/lab_services.py"]
          env:
            - name: MODE
              value: service
            - name: DEPENDENCY_URL
              valueFrom:
                configMapKeyRef:
                  name: service-config
                  key: DEPENDENCY_URL
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /debug/config
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: code
          configMap:
            name: lab-services-code
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: service-api
  namespace: nooa-admission-test
spec:
  selector:
    app.kubernetes.io/name: service-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-ops-mcp
  namespace: nooa-admission-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aks-ops-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aks-ops-mcp
    spec:
      serviceAccountName: aks-ops-mcp
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/lab_services.py"]
          env:
            - name: MODE
              value: mcp
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: auth
              mountPath: /var/run/lab-auth
              readOnly: true
            - name: tls
              mountPath: /var/run/lab-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: code
          configMap:
            name: lab-services-code
        - name: auth
          secret:
            secretName: aks-ops-mcp-auth
        - name: tls
          secret:
            secretName: aks-ops-mcp-tls
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aks-ops-mcp
  namespace: nooa-admission-test
spec:
  selector:
    app.kubernetes.io/name: aks-ops-mcp
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-inference
  namespace: nooa-admission-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-inference
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-inference
          image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/lab_services.py"]
          env:
            - name: MODE
              value: mock-inference
            - name: MOCK_MODEL
              value: ignite-mock-model
            - name: TLS_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /var/run/lab-tls
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: lab-services-code
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: tls
          secret:
            secretName: aks-ops-mcp-tls
---
apiVersion: v1
kind: Service
metadata:
  name: mock-inference
  namespace: nooa-admission-test
spec:
  selector:
    app.kubernetes.io/name: mock-inference
  ports:
    - name: http
      port: 8000
      targetPort: http
