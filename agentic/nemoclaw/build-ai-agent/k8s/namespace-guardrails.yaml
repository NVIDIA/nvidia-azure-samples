apiVersion: v1
kind: Namespace
metadata:
  name: nooa-admission-test
  labels:
    app.kubernetes.io/part-of: ignite-nemoclaw-lab
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: nemoclaw-lab-budget
  namespace: nooa-admission-test
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "2"
    limits.memory: 4Gi
    pods: "16"
    services: "6"
    configmaps: "12"
    secrets: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: nemoclaw-container-limits
  namespace: nooa-admission-test
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 256Mi
