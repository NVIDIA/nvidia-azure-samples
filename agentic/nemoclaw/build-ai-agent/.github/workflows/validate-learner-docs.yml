name: Validate learner documentation

on:
  push:
    paths:
      - 'docs/**'
      - 'LAB-GUIDE.md'
      - 'SKILLABLE-INSTRUCTIONS.md'
      - 'scripts/export-learner-docs.py'
      - '.github/workflows/validate-learner-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'LAB-GUIDE.md'
      - 'SKILLABLE-INSTRUCTIONS.md'
      - 'scripts/export-learner-docs.py'
      - '.github/workflows/validate-learner-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learner-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check Word and Markdown parity and learner command syntax
        run: python3 scripts/export-learner-docs.py --check
